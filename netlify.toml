# Netlify deploy config. The app is also Vercel-ready (see vercel.json) and is a
# plain Vite build + web-standard functions, so it ports to other hosts easily.
[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"
